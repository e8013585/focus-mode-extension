<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="app">

    <!-- ── Header ── -->
    <header class="app-header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2"
                fill="var(--accent)" opacity="0.9"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"
                stroke="var(--accent)" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="16" r="1.5" fill="var(--bg-primary)"/>
        </svg>
        <span class="app-name" id="appName"></span>
      </div>
      <span class="status-badge" id="statusBadge"></span>
    </header>

    <!-- ── Main content ── -->
    <main class="app-main">

      <!-- Countdown (visible only during active session) -->
      <section class="countdown-section" id="countdownSection" hidden>
        <p class="countdown-label" id="countdownLabel"></p>
        <div class="countdown-display" id="countdownDisplay">00:00</div>
      </section>

      <!-- Add domain -->
      <section class="section">
        <div class="input-row">
          <input
            type="text"
            id="domainInput"
            class="domain-input"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="btn btn-secondary" id="addBtn"></button>
        </div>
        <p class="error-msg" id="errorMsg" hidden></p>
      </section>

      <!-- Blocked sites list -->
      <section class="section">
        <h2 class="section-heading" id="blockedSitesHeading"></h2>
        <ul class="domain-list" id="domainList" role="list">
          <!-- populated by JS -->
        </ul>
        <p class="empty-state" id="emptyState" hidden></p>
      </section>

      <!-- Duration selector -->
      <section class="section">
        <label class="section-heading" for="durationSelect" id="durationLabel"></label>
        <select class="duration-select" id="durationSelect">
          <!-- populated by JS -->
        </select>
        <div class="custom-minutes-row" id="customMinutesRow" hidden>
          <input type="number" id="customMinutesInput" class="duration-input"
                 min="1" max="999" value="1" />
        </div>
      </section>

    </main>

    <!-- ── Footer / action button ── -->
    <footer class="app-footer">
      <button class="btn btn-primary" id="toggleBtn"></button>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
